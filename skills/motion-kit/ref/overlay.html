<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Graphics over someone's own footage. The page is transparent: render it with
       fastrender.py overlay.html --over clip.mp4 --out with-graphics.mp4
     It loads the clip's word timings from words.js (made by narrate/scripts/transcribe.py),
     and every graphic starts on the word it belongs to. Edit SAFE and CUES; leave the rest. -->
<link rel="stylesheet" href="../fonts/fonts.css">
<script src="words.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
  #stage { position:absolute; inset:0; font-family:'Inter', sans-serif; color:#0a0a0a; }
  /* Solid cards: frosted glass has nothing to blur once the background is transparent. */
  .card { position:absolute; background:#fffefb; border:.28vw solid #0a0a0a; border-radius:2.6vw; padding:2.4vw 3vw 2.6vw; box-shadow:0 1vw 0 #0a0a0a; transform-origin:50% 100%; will-change:transform, opacity; }
  .label { font:400 2.5vw 'JetBrains Mono'; letter-spacing:.14em; text-transform:uppercase; color:#6f6c66; margin-bottom:1.2vw; }
  .row { display:flex; align-items:center; gap:2vw; font:700 5vw 'Inter'; letter-spacing:-.02em; line-height:1.5; white-space:nowrap; }
  .box { flex:none; width:4.6vw; height:4.6vw; border:.28vw solid #0a0a0a; border-radius:1vw; display:flex; align-items:center; justify-content:center; }
  .box svg { width:74%; height:74%; }
  .num { font:400 17vw 'Archivo Black'; letter-spacing:-.04em; line-height:.95; }
  .guide { position:absolute; background:rgba(255,40,40,.22); border:2px dashed #f33; font:700 2vw 'JetBrains Mono'; color:#f33; padding:1vw; display:none; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ------------------------------------------------------------------ edit these
// Where graphics may sit, as fractions of the frame. This zone is the chest of a talking
// head: below the face, above the bottom third (captions), inside the middle 80% of the width.
const SAFE = { x: .10, y: .47, w: .80, h: .19 };
const QUIET_UNTIL = 3;            // nothing in the first seconds: that is the speaker's hook
const ACCENT = '#c8ff00';
// A list ticks one row on each spoken word; a count rolls from one spoken number to the next.
const CUES = [
  { kind: 'list', label: 'Every morning', items: [['The report', 'report'], ['The stock count', 'stock'], ['The payment check', 'payment']], hold: 1.0 },
  { kind: 'count', label: 'Minutes a day', from: 180, to: 12, start: '180', end: '12', hold: 2 },
];

// ------------------------------------------------------------------ engine
const W = window.WORDS || { duration: 10, words: [] }, DURATION = W.duration;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3), spring = x => x <= 0 ? 0 : 1 - Math.exp(-x * 8) * Math.cos(x * 20), bump = x => x <= 0 || x >= 1 ? 0 : Math.sin(x * Math.PI);
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
// when a word is spoken, searching forward from `after` so repeated words resolve in order
function when(word, after = 0) { const w = W.words.find(x => x.t0 >= after && norm(x.w) === norm(word)); if (!w) console.warn('word not found:', word); return w || { t0: after, t1: after + .3 }; }
const stage = document.getElementById('stage'), SFX = [], TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l5 5L20 6" pathLength="1" stroke-dasharray="1 1"/></svg>';
let cursor = QUIET_UNTIL;
const built = CUES.map((c, k) => {
  const el = document.createElement('div'); el.className = 'card'; el.style.left = SAFE.x * 100 + '%'; el.style.top = SAFE.y * 100 + '%'; el.style.minWidth = SAFE.w * 62 + '%';
  let t0, t1, parts;
  if (c.kind === 'list') {
    el.innerHTML = `<div class="label">${c.label}</div>` + c.items.map(([text]) => `<div class="row"><span class="box">${TICK}</span><span>${text}</span></div>`).join('');
    parts = c.items.map(([, word]) => { const w = when(word, cursor); cursor = w.t0 + .05; SFX.push({ t: w.t0, type: 'tick', x: SFX.length }); return w.t0; });
    t0 = parts[0] - .25; t1 = parts[parts.length - 1] + .5 + (c.hold || 1);
  } else {
    el.innerHTML = `<div class="label">${c.label}</div><div class="num">${c.from}</div>`;
    const a = when(c.start, cursor), b = when(c.end, a.t1); cursor = b.t1; parts = [a.t0, b.t0 + .12];
    SFX.push({ t: a.t1, type: 'count', x: Math.max(.3, parts[1] - a.t1) }, { t: parts[1], type: 'chime' });
    t0 = a.t0 - .25; t1 = Math.min(DURATION, b.t1 + (c.hold || 1));
  }
  stage.append(el);
  return { c, el, t0: Math.max(QUIET_UNTIL, t0), t1, parts };
});
built.forEach((b, k) => { const next = built[k + 1]; if (next) b.t1 = Math.min(b.t1, next.t0 - .1); });   // one card on screen at a time

function render(t) {
  for (const b of built) {
    const on = t >= b.t0 && t < b.t1 + .3, out = eo(seg(t, b.t1, b.t1 + .28));
    b.el.style.opacity = on ? 1 - out : 0; if (!on) continue;
    // rise and pop in; drop away on the way out
    b.el.style.transform = `translateY(${((1 - eo(seg(t, b.t0, b.t0 + .35))) * 60 + out * 40).toFixed(1)}px) scale(${(.9 + .1 * spring((t - b.t0) * 1.2)).toFixed(4)})`;
    if (b.c.kind === 'list') {
      [...b.el.querySelectorAll('.row')].forEach((row, i) => {
        const x = t - b.parts[i], box = row.children[0];
        row.style.opacity = x > -.05 ? 1 : .28;
        box.style.background = x > 0 ? ACCENT : 'transparent'; box.style.transform = `scale(${(1 + bump(x / .28) * .35).toFixed(3)})`;
        box.querySelector('path').style.strokeDashoffset = 1 - eo(seg(x, 0, .22));
      });
    } else {
      const [a, e] = b.parts, p = eo(seg(t, a + .3, e)), n = b.el.querySelector('.num');
      n.textContent = Math.round(b.c.from + (b.c.to - b.c.from) * p);
      n.style.transform = `scale(${(1 + bump((t - e) / .3) * .12).toFixed(3)})`; n.style.transformOrigin = 'left bottom';
      n.style.background = p >= 1 ? `linear-gradient(transparent 62%, ${ACCENT} 62%)` : 'none'; n.style.display = 'inline-block';
    }
  }
}
// ?guides shows the areas to keep clear (face band, caption third, edges) for a stills check
if (location.search.includes('guides')) [['face', 0, .15, 1, .3], ['captions', 0, .667, 1, .333], ['edge', 0, 0, .1, 1], ['edge', .9, 0, .1, 1]].forEach(([n, x, y, w, h]) => {
  const g = document.createElement('div'); g.className = 'guide'; g.textContent = n; Object.assign(g.style, { left: x * 100 + '%', top: y * 100 + '%', width: w * 100 + '%', height: h * 100 + '%', display: 'block' }); stage.append(g); });
window.render = render; window.DURATION = DURATION; window.SFX = SFX.sort((a, b) => a.t - b.t);
window.ready = document.fonts.ready.then(() => Promise.all(['700 40px Inter', '400 40px "Archivo Black"', '400 20px "JetBrains Mono"'].map(f => document.fonts.load(f))));
</script>
</body>
</html>
