<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="decoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1be"/>
      <stop offset="25%" stop-color="#d1a74a"/>
      <stop offset="60%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#8a6316"/>
    </linearGradient>
    <linearGradient id="emeraldDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146d5c"/>
      <stop offset="100%" stop-color="#0a3d33"/>
    </linearGradient>
    <radialGradient id="sunburstGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fce396" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Diamond with Stepped Deco Ziggurat -->
  <rect x="20" y="20" width="200" height="200" rx="4" fill="#0d0d0d" stroke="url(#decoGold)" stroke-width="3"/>
  <rect x="28" y="28" width="184" height="184" rx="2" fill="none" stroke="#d1a74a" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="34" y="34" width="172" height="172" fill="url(#emeraldDeep)" stroke="url(#decoGold)" stroke-width="1.5"/>

  <!-- Deco Radiating Sunburst Rays -->
  <g stroke="url(#decoGold)" stroke-width="1" opacity="0.6">
    <line x1="120" y1="40" x2="120" y2="80"/>
    <line x1="120" y1="200" x2="120" y2="160"/>
    <line x1="40" y1="120" x2="80" y2="120"/>
    <line x1="200" y1="120" x2="160" y2="120"/>
    <line x1="60" y1="60" x2="90" y2="90"/>
    <line x1="180" y1="60" x2="150" y2="90"/>
    <line x1="60" y1="180" x2="90" y2="150"/>
    <line x1="180" y1="180" x2="150" y2="150"/>
  </g>

  <!-- Stepped Chevron Crest Frame -->
  <polygon points="120,44 196,120 120,196 44,120" fill="#0d0d0d" stroke="url(#decoGold)" stroke-width="2.5"/>

  <!-- Geometric Interlocked "NX" Art Deco Monogram -->
  <g fill="none" stroke="url(#decoGold)" stroke-linecap="square">
    <!-- N -->
    <path d="M 72,160 L 72,80 L 112,160 L 112,80" stroke-width="6"/>
    <!-- X -->
    <path d="M 128,80 L 168,160" stroke-width="6"/>
    <path d="M 168,80 L 128,160" stroke-width="6"/>
    <!-- Center Jewel Dot / Flamingo Accent -->
    <circle cx="120" cy="120" r="4" fill="#e8837a" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Deco Corner Stepped Accents -->
  <g fill="url(#decoGold)">
    <polygon points="20,20 36,20 20,36"/>
    <polygon points="220,20 204,20 220,36"/>
    <polygon points="20,220 36,220 20,204"/>
    <polygon points="220,220 204,220 220,204"/>
  </g>

  <!-- Subtitle Text -->
  <text x="120" y="184" font-family="'Josefin Sans', 'Century Gothic', sans-serif" font-size="9" fill="#f1e7d0" font-weight="700" letter-spacing="4" text-anchor="middle">BOMBAY 1935</text>
</svg>
