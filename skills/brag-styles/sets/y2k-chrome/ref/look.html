<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../motion-kit/fonts/fonts.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1920px; height:1080px; overflow:hidden; }
#stage { position:absolute; inset:0; overflow:hidden; font-family:'JetBrains Mono',monospace; background:linear-gradient(180deg,#d9f1ff,#BFE6FF 55%,#a6d6ff); }
.abs { position:absolute; }
#grid { position:absolute; inset:-48px; background:radial-gradient(circle,rgba(36,64,255,.3) 3px,transparent 3.5px) 0 0/48px 48px; }
/* things centred on their own point: orbs, stars, rings */
.ob { position:absolute; left:0; top:0; width:var(--z); height:var(--z); margin:calc(var(--z) / -2) 0 0 calc(var(--z) / -2); }
.orb { border-radius:50%; background:radial-gradient(circle at 36% 30%,var(--a),var(--b) 72%); box-shadow:inset 0 calc(var(--z) * -.07) calc(var(--z) * .16) rgba(0,20,120,.35),0 calc(var(--z) * .16) calc(var(--z) * .3) rgba(36,64,255,.28); }
.orb::before { content:""; position:absolute; left:17%; top:8%; width:46%; height:28%; border-radius:50%; background:linear-gradient(180deg,#fff,rgba(255,255,255,.15)); }
.star path { stroke:#2440FF; stroke-width:5; stroke-linejoin:round; }
.ring { border:5px solid #FF4FD8; border-radius:50%; }
/* chrome type: cobalt outline underneath, silver gradient and a moving glint on top */
.ln { display:flex; gap:.28em; justify-content:center; white-space:nowrap; font:800 1em/.98 'Bricolage Grotesque'; transform:scaleX(1.25); }
.w { display:inline-block; }
.c { position:relative; display:inline-block; color:#2440FF; -webkit-text-stroke:.085em #2440FF; filter:drop-shadow(0 .06em 0 #FF4FD8); }
.c::after { content:attr(data-t); position:absolute; left:0; top:0; -webkit-text-stroke:0; color:transparent; -webkit-background-clip:text; background-clip:text;
  background-image:linear-gradient(100deg,transparent calc(var(--s,-50) * 1% - 16%),#fff calc(var(--s,-50) * 1%),transparent calc(var(--s,-50) * 1% + 16%)),linear-gradient(180deg,#F4F7FA 0,#B9C8D8 40%,#8FA3B8 52%,#EEF3F8 55%,#F4F7FA 72%,#AEBFD0 100%); }
#hook { left:0; top:300px; width:1920px; font-size:165px; }
/* plain desktop windows */
.win { position:absolute; width:820px; height:480px; border:5px solid #2440FF; border-radius:18px; overflow:hidden; background:#fff; box-shadow:0 28px 48px rgba(36,64,255,.32); }
.bar { height:56px; display:flex; align-items:center; padding:0 14px; color:#fff; font-size:24px; background:linear-gradient(180deg,#8ea0ff,#2440FF 50%,#1830d6 51%,#3a56ff); }
.bar b { flex:1; font-weight:400; }
.bar s { text-decoration:none; width:32px; height:32px; margin-left:8px; border-radius:9px; text-align:center; line-height:30px; font-size:22px; color:#2440FF; background:linear-gradient(#fff,#BFE6FF); }
.body { position:relative; overflow:hidden; height:calc(100% - 56px); background:radial-gradient(circle,rgba(36,64,255,.16) 2px,transparent 2.5px) 0 0/32px 32px,linear-gradient(180deg,#fff,#E3F4FF); }
.tl { position:absolute; width:120px; height:120px; border-radius:14px; border:3px solid #fff; box-shadow:0 0 0 3px #2440FF; }
.fr { position:absolute; height:14px; border-radius:7px; background:#9fc9ee; }
#w1 { left:240px; top:130px; } #w2 { left:550px; top:250px; } #w3 { left:860px; top:370px; }
#proof { position:absolute; inset:0; }
#num { position:absolute; left:26px; top:8px; font-size:140px; letter-spacing:.05em; justify-content:flex-start; transform-origin:0 50%; }
#lab { position:absolute; left:300px; top:34px; font:800 50px 'Bricolage Grotesque'; color:#2440FF; white-space:nowrap; }
#tag { position:absolute; left:300px; top:112px; padding:6px 20px; border-radius:20px; background:#2440FF; color:#fff; font-size:26px; transform:rotate(-4deg); }
#trk { position:absolute; left:36px; top:196px; width:738px; height:48px; border:4px solid #2440FF; border-radius:26px; background:#fff; overflow:hidden; }
#fill { height:100%; width:0; background:linear-gradient(135deg,#FF4FD8 25%,#ff9be9 25% 50%,#FF4FD8 50% 75%,#ff9be9 75%) 0 0/57px 57px; }
#btn { position:absolute; left:36px; top:316px; width:280px; height:72px; border-radius:40px; text-align:center; font:800 38px/64px 'Bricolage Grotesque'; color:#2440FF; border:4px solid #2440FF; background:linear-gradient(180deg,#e6ff9e,#B6FF3B 50%,#9be01f 52%,#c8ff5c); }
#pct { position:absolute; right:36px; top:322px; font-size:54px; color:#2440FF; }
#end { position:absolute; left:0; top:0; width:1910px; height:1014px; }
#e1, #e2 { position:absolute; left:0; width:1910px; font-size:210px; }
#dom { position:absolute; left:685px; top:668px; width:540px; padding:14px 40px; border:5px solid #2440FF; border-radius:60px; font-size:56px; color:#2440FF; background:linear-gradient(180deg,#fff,#d6ecff); box-shadow:0 10px 0 #FF4FD8; }
#dom span { display:inline-block; overflow:hidden; white-space:nowrap; vertical-align:bottom; border-right:5px solid transparent; }
</style></head><body>
<div id="stage">
  <div id="grid"></div>
  <div id="hook" class="abs"><div class="ln" id="h1"></div><div class="ln" id="h2"></div></div>
  <div class="win" id="w1"><div class="bar"><b>new_roll.exe</b><s>_</s><s>&#9633;</s><s>x</s></div><div class="body"></div></div>
  <div class="win" id="w2"><div class="bar"><b>friends</b><s>_</s><s>&#9633;</s><s>x</s></div><div class="body"></div></div>
  <div class="win" id="w3"><div class="bar"><b>download</b><s>_</s><s>&#9633;</s><s>x</s></div>
    <div class="body">
      <div id="end"><div id="e1" class="ln"></div><div id="e2" class="ln"></div><div id="dom"><span>yourbrand.com</span></div></div>
      <div id="proof"><div class="ln" id="num"><span class="c" data-t="0">0</span></div><div id="lab">shots, no retakes</div><div id="tag">sample</div>
        <div id="trk"><div id="fill"></div></div><div id="btn">download</div><div id="pct">0%</div></div>
    </div></div>
</div>
<script>
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const spring = x => x <= 0 ? 0 : 1 - Math.exp(-x * 8) * Math.cos(x * 20);
const bump = x => x <= 0 || x >= 1 ? 0 : Math.sin(x * Math.PI);
const lerp = (a, b, p) => a + (b - a) * p;
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
window.DURATION = 10;
const PINK = '#FF4FD8', LIME = '#B6FF3B', COB = '#2440FF', ICE = '#BFE6FF', PAL = [PINK, LIME, COB, '#fff'];

// small builders
const mk = (p, h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); const e = d.firstChild; p.appendChild(e); return e; };
const put = (e, x, y, s = 1, r = 0, sy = s) => e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s},${sy})`;
const star = (p, z, f) => mk(p, `<svg class="ob star" viewBox="-50 -50 100 100" style="--z:${z}px"><path fill="${f}" d="M0-48C4-14 14-4 48 0C14 4 4 14 0 48C-4 14-14 4-48 0C-14-4-4-14 0-48Z"/></svg>`);
const orb = (p, z, a, b) => mk(p, `<div class="ob orb" style="--z:${z}px;--a:${a};--b:${b}"></div>`);
const words = (p, a) => a.map(w => { const s = mk(p, `<span class="w"><span class="c" data-t="${w}">${w}</span></span>`); return { w: s, c: s.firstChild }; });
const glint = (o, v) => o.c.style.setProperty('--s', v);

// scenery: backdrop orbs and twinkling sparkles
const st = $('#stage'), grid = $('#grid');
const DEC = [[190, 170, 210, '#ffd1f4', PINK], [1700, 790, 250, '#efffc2', LIME], [1640, 170, 130, '#a9b8ff', COB]].map(d => ({ x: d[0], y: d[1], e: orb(grid.parentNode, d[2], d[3], d[4]) }));
const AMB = Array.from({ length: 12 }, (_, i) => ({ x: 70 + rnd(i) * 1780, y: 50 + rnd(i + 30) * 880, e: star(st, 26 + rnd(i + 60) * 30, PAL[i % 4]) }));
$('#hook').before(...DEC.map(d => d.e), ...AMB.map(a => a.e));

// hook words, end words, window furniture
const HW = [...words($('#h1'), ['ur', 'camera', 'roll']), ...words($('#h2'), ['is', 'boring.'])];
const EW = [...words($('#e1'), ['get', 'it', 'b4']), ...words($('#e2'), ['friday.'])];
$('#e1').style.top = '170px'; $('#e2').style.top = '376px';
const num = $('#num').firstChild;
const b1 = $('#w1 .body'), b2 = $('#w2 .body');
for (let i = 0; i < 12; i++) mk(b1, `<div class="tl" style="left:${18 + (i % 4) * 134}px;top:${18 + Math.floor(i / 4) * 134}px;background:radial-gradient(circle at 70% 28%,rgba(255,255,255,.9) 0 11%,transparent 12%),linear-gradient(135deg,${PAL[i % 3]},${PAL[(i + 1) % 3]})"></div>`);
for (let i = 0; i < 4; i++) { orb(b2, 64, '#fff', [PINK, LIME, COB, ICE][i]).style.cssText += `left:70px;top:${60 + i * 92}px;`; mk(b2, `<div class="fr" style="left:120px;top:${48 + i * 92}px;width:170px"></div>`); mk(b2, `<div class="fr" style="left:120px;top:${74 + i * 92}px;width:100px;opacity:.6"></div>`); }
const EO = [[210, 780, 190, '#ffd1f4', PINK], [1700, 250, 150, '#efffc2', LIME], [1560, 820, 110, '#a9b8ff', COB]].map(d => ({ x: d[0], y: d[1], e: orb($('#end'), d[2], d[3], d[4]) }));
const ES = Array.from({ length: 8 }, (_, i) => ({ x: 80 + rnd(i + 5) * 1750, y: 60 + rnd(i + 25) * 800, e: star($('#end'), 30 + rnd(i + 45) * 26, PAL[i % 4]) }));
$('#end').prepend(...ES.map(s => s.e), ...EO.map(o => o.e));

// bursts, orb, cursor and click ring sit above the windows
const BA = Array.from({ length: 16 }, (_, i) => star(st, 64, PAL[i % 4])), BB = Array.from({ length: 14 }, (_, i) => star(st, 64, PAL[(i + 1) % 4]));
const ball = orb(st, 76, '#ffd1f4', PINK), ring = mk(st, '<div class="ob ring" style="--z:200px"></div>');
const cur = mk(st, '<svg class="abs" width="52" height="64" viewBox="0 0 34 52" style="left:0;top:0;overflow:visible"><path d="M2 2V40L12 31L19 48L26 45L19 29H33Z" fill="#fff" stroke="#2440FF" stroke-width="3" stroke-linejoin="round"/></svg>');
const burst = (arr, t0, cx, cy, t, seed) => arr.forEach((s, i) => {
  const u = t - t0, a = rnd(i + seed) * 6.283, d = (300 + rnd(i + seed + 40) * 520) * u * (1 - .3 * u);
  const sc = u < 0 || u > 1.1 ? 0 : clamp(u * 10) * (1 - seg(u, .45, 1.1)) * (.5 + rnd(i + seed + 80) * .9);
  put(s, cx + Math.cos(a) * d, cy + Math.sin(a) * d + 380 * u * u, sc, u * (160 + rnd(i + 9) * 240));
});

// the glossy orb's route: hops from window to window, then rides the bar's tip
const ORBY = 592, TIP = p => 905 + 730 * p;
const HOP = [[2.65, 3.0, 800, -90, 800, 116, 0], [3.1, 3.5, 800, 116, 1110, 236, 150], [3.6, 3.95, 1110, 236, 1420, 356, 150], [4.85, 5.25, 1420, 356, 920, ORBY, 200]];
function orbAt(t) {
  const h = HOP.find(h => t >= h[0] && t < h[1]);
  if (h) { const p = (t - h[0]) / (h[1] - h[0]), s = Math.sin(p * Math.PI) * .12; return [lerp(h[2], h[4], p), lerp(h[3], h[5], p) - Math.sin(p * Math.PI) * h[6], 1 - s * .6, 1 + s]; }
  const L = HOP.filter(h => t >= h[1]).pop(); if (!L) return [0, -200, 1, 1];
  const sq = bump((t - L[1]) / .16) * .22; let x = L[4], y = L[5];
  if (t >= 3.95 && t < 4.85) y -= Math.abs(Math.sin(Math.PI * (t - 3.95) / .45)) * 24;
  if (t >= 5.25) { x = TIP(eio(seg(t, 5.0, 6.45))); y = ORBY - Math.abs(Math.sin((t - 5.25) * 8)) * 26; }
  return [x, y, 1 + sq * .6, 1 - sq];
}

window.SFX = [{ t: 1.2, type: 'whoosh', x: 0 }, { t: 2.5, type: 'pop', x: -.4 }, { t: 3.05, type: 'pop', x: 0 }, { t: 3.5, type: 'pop', x: .4 },
  { t: 3.0, type: 'tick', x: -.3 }, { t: 3.5, type: 'tick', x: 0 }, { t: 3.95, type: 'tick', x: .3 }, { t: 4.8, type: 'click', x: .2 },
  { t: 6.45, type: 'success', x: .5 }, { t: 6.5, type: 'confetti', x: .5 }, { t: 7.0, type: 'whoosh', x: 0 }, { t: 7.5, type: 'pop', x: -.3 },
  { t: 7.8, type: 'pop', x: .3 }, { t: 8.15, type: 'type', x: 0 }, { t: 8.5, type: 'chime', x: 0 }];
for (let i = 0; i < 5; i++) SFX.push({ t: .15 + i * .17, type: 'pop', x: -.5 + i * .25 });
for (let t = 5.1; t < 6.4; t += .15) SFX.push({ t, type: 'tick', x: .3 });

function render(t) {
  grid.style.transform = `translate(${(t * 22) % 48}px,${(t * 14) % 48}px)`;
  DEC.forEach((d, i) => put(d.e, d.x, d.y + Math.sin(t * 1.3 + i * 2) * 20, spring((t - i * .12) * 1.8)));
  AMB.forEach((a, i) => put(a.e, a.x, a.y, Math.pow(Math.max(0, Math.sin(t * 2.4 + i * 1.7)), 2), t * 40 + i * 30));

  // 0 - 2.5: the hook pops in word by word, a glint runs through it, then it shrinks away
  $('#hook').style.transform = `scale(${1 + .04 * seg(t, 0, 2.4)})`;
  $('#hook').style.visibility = t < 2.9 ? 'visible' : 'hidden';
  HW.forEach((h, i) => {
    const u = t - .12 - i * .17, out = eio(seg(t, 2.3 + i * .05, 2.62 + i * .05));
    h.w.style.transform = `rotate(${-8 * (1 - eo(clamp(u * 2)))}deg) scale(${spring(u * 1.8) * (1 - out)})`;
    glint(h, lerp(-30, 130, seg(t, 1.0 + i * .12, 1.9 + i * .12)));
  });

  // 2.5 - 7: windows stack up, the orb hops between them, the cursor downloads
  [['#w1', 2.45, 3.0], ['#w2', 3.0, 3.5], ['#w3', 3.45, 3.95]].forEach(([id, t0, land]) => {
    const u = t - t0, e = $(id);
    e.style.visibility = u < 0 ? 'hidden' : 'visible'; e.style.opacity = clamp(u * 8);
    e.style.transform = `translateY(${bump((t - land) / .2) * 10}px) rotate(${-5 * (1 - eo(clamp(u * 2.2)))}deg) scale(${spring(u * 1.8)})`;
  });
  const p = eio(seg(t, 5.0, 6.45)), n = Math.round(24 * p), pop = bump((t - 6.45) / .35) * .12;
  $('#fill').style.width = 730 * p + 'px'; $('#fill').style.backgroundPosition = `${-t * 70}px 0`;
  $('#pct').textContent = Math.round(p * 100) + '%';
  num.textContent = n; num.dataset.t = n; glint({ c: num }, ((t * 60) % 240) - 60);
  $('#num').style.transform = `scale(${1.25 * (1 + pop)},${1 + pop})`;
  const hov = eio(seg(t, 4.5, 4.7)), prs = bump((t - 4.8) / .28);
  $('#btn').style.transform = `translateY(${-4 * hov + 8 * prs}px)`; $('#btn').style.boxShadow = `0 ${8 + 4 * hov - 8 * prs}px 0 #2440FF`;
  const [ox, oy, sx, sy] = orbAt(t), pu = t - 6.45;
  ball.style.opacity = t < 2.65 || pu > .22 ? 0 : 1 - seg(pu, .08, .22);
  put(ball, ox, oy, sx * (1 + eo(seg(pu, 0, .2)) * .8), 0, sy * (1 + eo(seg(pu, 0, .2)) * .8));
  const tv = eio(seg(t, 4.0, 4.7)), dr = eio(seg(t, 5.0, 6.5)), ru = (t - 4.8) / .55;
  cur.style.opacity = seg(t, 3.95, 4.1) * (1 - seg(t, 6.9, 7.05));
  put(cur, lerp(1580, 1052, tv) + 200 * dr, lerp(720, 782, tv) - 90 * dr);
  ring.style.opacity = ru > 0 && ru < 1 ? 1 - ru : 0; put(ring, 1052, 782, .1 + eo(clamp(ru)) * .9);
  burst(BA, 6.45, 1635, 600, t, 3);

  // 7 - 10: the download window maximises into the end card
  const m = eio(seg(t, 7, 7.6)), w3 = $('#w3').style;
  w3.left = lerp(860, 0, m) + 'px'; w3.top = lerp(370, 0, m) + 'px'; w3.width = lerp(820, 1920, m) + 'px'; w3.height = lerp(480, 1080, m) + 'px'; w3.borderRadius = lerp(18, 0, m) + 'px';
  $('#proof').style.opacity = 1 - seg(t, 7, 7.25); $('#proof').style.visibility = t > 7.3 ? 'hidden' : 'visible';
  EW.forEach((w, i) => {
    const u = t - (i < 3 ? 7.5 + i * .08 : 7.8);
    w.w.style.transform = `rotate(${-6 * (1 - eo(clamp(u * 2)))}deg) scale(${spring(u * 1.8)})`;
    glint(w, ((t - 7.6) * 45 + i * 22) % 230 - 40);
  });
  EO.forEach((o, i) => put(o.e, o.x, o.y + Math.sin(t * 1.4 + i * 2) * 18, spring((t - 7.6 - i * .1) * 1.8)));
  ES.forEach((s, i) => put(s.e, s.x, s.y, Math.pow(Math.max(0, Math.sin(t * 2.4 + i * 1.7)), 2) * seg(t, 7.6, 7.8), t * 40 + i * 30));
  const dp = (t - 7.98) * 1.8, tp = seg(t, 8.15, 8.45), dm = $('#dom');
  dm.style.transform = `scale(${spring(dp)})`; dm.firstChild.style.width = Math.round(13 * tp) + 'ch';
  dm.firstChild.style.borderRightColor = tp > 0 && tp < 1 ? PINK : 'transparent';
  burst(BB, 7.5, 960, 520, t, 7);
}
window.render = render;
window.ready = Promise.all([document.fonts.load('800 40px "Bricolage Grotesque"'), document.fonts.load('400 24px "JetBrains Mono"'), document.fonts.ready]).then(() => render(0));
</script></body></html>
