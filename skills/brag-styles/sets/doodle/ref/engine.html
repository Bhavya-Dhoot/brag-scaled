<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&family=Patrick+Hand&display=block" rel="stylesheet">
<style>
  
  :root { --ink:#0a0a0a; --paper:#f0ede8; --muted:#6f6c66; --accent:#c8ff00; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:var(--paper); color:var(--ink); }
  #stage { position:absolute; inset:0; overflow:hidden; background:var(--paper); }
  #grid { position:absolute; inset:0;
    background-image: linear-gradient(rgba(10,10,10,.07) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(10,10,10,.07) 1.5px, transparent 1.5px);
    background-size: 60px 60px; }
  #grain { position:absolute; inset:0; opacity:.35; mix-blend-mode:multiply; }
  .scene { position:absolute; inset:0; display:none; }
  .scene svg.ink { position:absolute; inset:0; overflow:visible; }
  .scene svg.ink path { fill:none; stroke:var(--ink); stroke-linecap:round; stroke-linejoin:round; }
  .t { position:absolute; will-change:clip-path, transform, opacity; }
  .hand { font-family:'Patrick Hand', cursive; }
  .disp { font-family:'Archivo', sans-serif; font-weight:800; letter-spacing:-.04em; line-height:.95; }
  .body { font-family:'Archivo', sans-serif; font-weight:500; letter-spacing:-.01em; line-height:1.2; }
  .mono { font-family:'JetBrains Mono', monospace; }
  .mk { position:relative; display:inline-block; z-index:0; }
  .mk > i { position:absolute; left:-.08em; right:-.08em; top:.52em; bottom:-.02em; background:var(--accent); z-index:-1; transform-origin:left center; transform:scaleX(0) skewX(-6deg); }
  .chip { background:var(--ink); color:var(--paper); padding:14px 20px; font-size:24px; letter-spacing:.06em; line-height:1.45; border-radius:4px; }
  u { text-decoration:none; background:#c8ff00; }
  .chip b { color:var(--accent); font-weight:700; }
  .hud { position:absolute; font-family:'JetBrains Mono', monospace; font-size:20px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); z-index:40; }
  #wipe { position:absolute; inset:0; z-index:60; pointer-events:none; overflow:visible; }
  #wipe path { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .dark #hud-a, .dark #hud-b, .dark #hud-c, .dark #hud-d { color:#8a8a8a; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <svg id="grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .18 0"/></filter><rect width="1920" height="1080" filter="url(#n)"/></svg>
  <svg width="0" height="0" style="position:absolute">
    <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div id="scenes"></div>
  <div class="hud" id="hud-a" style="left:140px;top:64px">BD / Automation</div>
  <div class="hud" id="hud-b" style="right:140px;top:64px"></div>
  <div class="hud" id="hud-c" style="left:140px;bottom:52px">bhavya-dhoot.vercel.app</div>
  <div class="hud" id="hud-d" style="right:140px;bottom:52px"></div>
  <svg id="wipe" width="1920" height="1080"><path id="wipe-p" pathLength="1"/></svg>
</div>
<script>
// ------------------------------------------------------------------ utils
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);                       // ease-out cubic
const eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const spring = x => x <= 0 ? 0 : 1 - Math.exp(-x * 8) * Math.cos(x * 20); // overshoots then settles
let _s = 20260929; const rnd = () => (_s = (_s * 16807) % 2147483647) / 2147483647;
const J = a => (rnd() - .5) * 2 * a;
const f1 = v => v.toFixed(1);
const P = (x, y) => `${f1(x)} ${f1(y)}`;
const SFX = [];

// ------------------------------------------------------------------ doodle path generators
function line(x1, y1, x2, y2, b = 5) {
  const mx = (x1 + x2) / 2 + J(b), my = (y1 + y2) / 2 + J(b);
  return `M${P(x1 + J(2), y1 + J(2))} Q${P(mx, my)} ${P(x2 + J(2), y2 + J(2))}`;
}
function rectP(x, y, w, h, o = 9) {
  return [line(x - o*rnd(), y, x + w + o*rnd(), y), line(x + w, y - o*rnd(), x + w, y + h + o*rnd()),
          line(x + w + o*rnd(), y + h, x - o*rnd(), y + h), line(x, y + h + o*rnd(), x, y - o*rnd())].join(' ');
}
function circleP(cx, cy, r, turn = 1.1, a0 = -2.2) {
  const n = 56; let d = '';
  for (let i = 0; i <= n; i++) {
    const a = a0 + (i / n) * Math.PI * 2 * turn, rr = r * (1 + J(.025) + (i / n) * .05);
    d += (i ? ' L' : 'M') + P(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  return d;
}
function ellipseP(cx, cy, rx, ry) { return circleP(0, 0, 1000, 1.1).replace(/(-?\d+\.\d) (-?\d+\.\d)/g, (m, x, y) => `${f1(cx + x / 1000 * rx)} ${f1(cy + y / 1000 * ry)}`); }
function arcP(cx, cy, r, a1, a2) { // simple arc as polyline
  let d = ''; const n = 24;
  for (let i = 0; i <= n; i++) { const a = a1 + (a2 - a1) * i / n; d += (i ? ' L' : 'M') + P(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
  return d;
}
function arrowP(x1, y1, x2, y2, bend = 40, head = 24) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  const cx = mx - dy / L * bend, cy = my + dx / L * bend;
  const a = Math.atan2(y2 - cy, x2 - cx);
  return `M${P(x1, y1)} Q${P(cx, cy)} ${P(x2, y2)} M${P(x2 - Math.cos(a - .5) * head, y2 - Math.sin(a - .5) * head)} L${P(x2, y2)} L${P(x2 - Math.cos(a + .5) * head, y2 - Math.sin(a + .5) * head)}`;
}
const checkP = (x, y, s) => `M${P(x, y + s*.5)} L${P(x + s*.35, y + s*.88)} L${P(x + s, y)}`;
const crossP = (x, y, s) => `${line(x, y, x + s, y + s, 3)} ${line(x + s, y, x, y + s, 3)}`;
function scribLines(x, y, w, n, gap = 26) {
  let d = '';
  for (let i = 0; i < n; i++) {
    const ww = i === n - 1 ? w * (.4 + rnd() * .3) : w * (.85 + rnd() * .15), yy = y + i * gap;
    d += ` M${P(x, yy)}`; let cx = x;
    while (cx < x + ww) { const st = 18 + rnd() * 14; d += ` Q${P(cx + st / 2, yy + J(6))} ${P(Math.min(cx + st, x + ww), yy + J(1.5))}`; cx += st; }
  }
  return d;
}
function sparkP(x, y, s) {
  return [0, 1, 2, 3].map(k => { const a = k * Math.PI / 2 + .3; return line(x + Math.cos(a) * s * .35, y + Math.sin(a) * s * .35, x + Math.cos(a) * s, y + Math.sin(a) * s, 1); }).join(' ');
}
function gearP(cx, cy, r) {
  let d = circleP(cx, cy, r, 1.02) + ' ' + circleP(cx, cy, r * .38, 1.02);
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; d += ' ' + line(cx + Math.cos(a) * r, cy + Math.sin(a) * r, cx + Math.cos(a) * (r + 22), cy + Math.sin(a) * (r + 22), 1); }
  return d;
}
const personP = (x, y, s = 1) => `${circleP(x, y, 26 * s, 1.03)} ${line(x, y + 28*s, x, y + 110*s, 3)} ${line(x - 40*s, y + 60*s, x + 40*s, y + 60*s, 3)} ${line(x, y + 110*s, x - 30*s, y + 170*s, 3)} ${line(x, y + 110*s, x + 30*s, y + 170*s, 3)}`;
function cloudP(cx, cy, w) {
  const h = w * .45, x0 = cx - w / 2, y0 = cy + h / 2;
  return `M${P(x0 + 30, y0)} L${P(x0 + w - 30, y0)} ` +
    arcP(x0 + w - 40, y0 - 40, 45, Math.PI / 2, -Math.PI / 2).replace('M', 'L') + ' ' +
    arcP(cx + w * .12, cy - h * .25, w * .2, 0, -Math.PI).replace('M', 'L') + ' ' +
    arcP(cx - w * .22, cy - h * .05, w * .17, -Math.PI * .2, -Math.PI).replace('M', 'L') + ' ' +
    arcP(x0 + 40, y0 - 40, 42, -Math.PI / 2, -Math.PI * 1.5).replace('M', 'L');
}
function zigFill(x, y, w, h, rows) { // wipe scribble
  let d = `M${P(x, y)}`;
  for (let i = 1; i <= rows; i++) d += ` L${P(i % 2 ? x + w : x, y + (h * i) / rows + J(20))}`;
  return d;
}

// ------------------------------------------------------------------ scene engine
const scenes = [];
class Scene {
  constructor(t0, t1, chapter, opts = {}) {
    Object.assign(this, { t0, t1, chapter, tracks: [], hooks: [], dark: !!opts.dark, idx: opts.idx || '' });
    this.el = document.createElement('div'); this.el.className = 'scene';
    if (this.dark) this.el.style.background = '#0a0a0a';
    this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    this.svg.setAttribute('class', 'ink'); this.svg.setAttribute('width', 1920); this.svg.setAttribute('height', 1080);
    this.fills = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); this.g.setAttribute('filter', 'url(#boil)');
    this.svg.append(this.fills, this.g); this.el.append(this.svg);
    document.getElementById('scenes').append(this.el); scenes.push(this);
  }
  // draw-on stroke. at/dur are scene-local seconds
  path(d, at, dur = .5, o = {}) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d); p.setAttribute('pathLength', 1);
    p.style.strokeWidth = o.w || 5; if (o.color) p.style.stroke = o.color;
    p.style.strokeDasharray = '1 1';
    (o.parent || this.g).append(p);
    this.tracks.push({ kind: 'draw', el: p, at, dur });
    if (dur >= .3 && !o.quiet) SFX.push({ t: this.t0 + at, type: 'pencil', d: dur });
    return p;
  }
  // filled lime/ink rect that pops (not boiled — highlighter blocks stay crisp)
  block(x, y, w, h, at, o = {}) {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    Object.entries({ x, y, width: w, height: h, rx: o.rx ?? 4 }).forEach(([k, v]) => r.setAttribute(k, v));
    r.style.fill = o.color || '#c8ff00'; r.style.transformBox = 'fill-box'; r.style.transformOrigin = o.origin || 'left center';
    if (o.rot) r.dataset.rot = o.rot;
    this.fills.append(r);
    this.tracks.push({ kind: o.kind || 'grow', el: r, at, dur: o.dur || .35 });
    return r;
  }
  // HTML text. anim: write | pop | fade | stamp | none
  text(x, y, html, cls, at, o = {}) {
    const d = document.createElement('div'); d.className = 't ' + cls; d.innerHTML = html;
    Object.assign(d.style, { left: x + 'px', top: y + 'px' }, o.style || {});
    if (o.w) d.style.width = o.w + 'px';
    if (o.rot) d.dataset.rot = o.rot;
    this.el.append(d);
    const anim = o.anim || 'write';
    const dur = o.dur || (anim === 'write' ? Math.max(.5, d.textContent.length * .03) : .45);
    this.tracks.push({ kind: anim, el: d, at, dur });
    d.querySelectorAll('.mk > i').forEach((m, k) => this.tracks.push({ kind: 'marker', el: m, at: at + dur + .1 + k * .2, dur: .35 }));
    if (anim === 'write') SFX.push({ t: this.t0 + at, type: 'write', d: dur });
    if (anim === 'pop') SFX.push({ t: this.t0 + at, type: 'pop' });
    if (anim === 'stamp') SFX.push({ t: this.t0 + at + .12, type: 'stamp' });
    return d;
  }
  on(fn) { this.hooks.push(fn); }
  update(u) {
    for (const k of this.tracks) {
      const p = seg(u, k.at, k.at + k.dur), s = k.el.style, rot = +(k.el.dataset.rot || 0);
      switch (k.kind) {
        case 'draw': s.strokeDashoffset = 1 - eo(p); s.opacity = p > 0 ? 1 : 0; break;
        case 'grow': s.transform = `scaleX(${eo(p)})`; break;
        case 'growY': s.transform = `scaleY(${eo(p)})`; break;
        case 'write': s.clipPath = `inset(-30% ${f1((1 - p) * 100)}% -30% -2%)`; s.opacity = p > 0 ? 1 : 0; s.transform = rot ? `rotate(${rot}deg)` : ''; break;
        case 'fade': s.opacity = p; s.transform = `translateY(${f1((1 - eo(p)) * 30)}px) rotate(${rot}deg)`; break;
        case 'pop': { const x = u - k.at; const sc = x <= 0 ? 0 : spring(x * 1.1); s.opacity = x > 0 ? 1 : 0; s.transform = `scale(${sc.toFixed(3)}) rotate(${rot}deg)`; break; }
        case 'popb': { const x = u - k.at; const sc = x <= 0 ? 0 : spring(x * 1.1); s.transform = `scale(${sc.toFixed(3)}) rotate(${rot}deg)`; s.transformOrigin = 'center'; break; }
        case 'stamp': { const x = u - k.at; const q = clamp(x / .16); s.opacity = x > 0 ? 1 : 0; s.transform = `scale(${(2.4 - 1.4 * eo(q) + (q >= 1 ? spring((x - .16) * 1.5) * 0 : 0)).toFixed(3)}) rotate(${rot}deg)`; break; }
        case 'marker': s.transform = `scaleX(${eo(p)}) skewX(-6deg)`; break;
      }
    }
    for (const fn of this.hooks) fn(u);
  }
}

// helpers for common pieces
function badge(S, x, y, n, at) { S.path(circleP(x, y, 34), at, .4, { w: 4 }); S.text(x - 40, y - 25, String(n), 'mono', at + .25, { anim: 'pop', w: 80, style: { textAlign: 'center', fontSize: '34px', fontWeight: 700 } }); }

// ================================================================== SCENE 0 — the gap (0–8)
{
  const S = new Scene(0, 8, 'The gap');
  S.path(rectP(170, 250, 560, 360), .15, .7, { w: 6 });
  S.text(215, 285, 'AI DEMO', 'mono', .7, { anim: 'pop', style: { fontSize: '30px', fontWeight: 700, letterSpacing: '.2em' } });
  S.block(212, 380, 470, 150, .9, { color: '#c8ff00', dur: .4 });
  S.path(checkP(365, 395, 150), 1.05, .45, { w: 12 });
  S.path(sparkP(760, 250, 44), 1.3, .3, { w: 4 }); S.path(sparkP(150, 640, 34), 1.4, .3, { w: 4, quiet: 1 }); S.path(sparkP(700, 650, 28), 1.5, .3, { w: 4, quiet: 1 });
  S.text(172, 660, 'Works on stage.', 'hand', 1.6, { style: { fontSize: '64px' } });

  S.path(arrowP(790, 430, 1060, 430, -50), 2.6, .5, { w: 6 });

  // the mess
  const g1 = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g1.setAttribute('transform', 'rotate(-7 1250 420)'); S.g.append(g1);
  S.path(rectP(1110, 220, 290, 380), 3.0, .45, { parent: g1 });
  S.path(rectP(1140, 250, 110, 50, 4), 3.3, .25, { parent: g1, w: 4, quiet: 1 });
  S.path(scribLines(1140, 340, 230, 7, 30), 3.35, .6, { parent: g1, w: 3 });
  S.path(circleP(1330, 540, 38, 1.2), 3.6, .3, { parent: g1, w: 3, quiet: 1 });
  const g2 = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g2.setAttribute('transform', 'rotate(5 1580 420)'); S.g.append(g2);
  S.path(rectP(1420, 300, 340, 250), 3.4, .45, { parent: g2 });
  for (let r = 1; r < 4; r++) S.path(line(1420, 300 + r * 62, 1760, 300 + r * 62, 2), 3.6 + r * .05, .2, { parent: g2, w: 3, quiet: 1 });
  for (let c = 1; c < 3; c++) S.path(line(1420 + c * 113, 300, 1420 + c * 113, 550, 2), 3.7 + c * .05, .2, { parent: g2, w: 3, quiet: 1 });
  S.text(1560, 395, '#N/A', 'mono', 3.9, { anim: 'pop', rot: 5, style: { fontSize: '30px', fontWeight: 700 } });
  S.text(1450, 455, '??', 'hand', 4.0, { anim: 'pop', rot: 5, style: { fontSize: '46px' } });
  S.text(1660, 330, '#REF!', 'mono', 4.1, { anim: 'pop', rot: 5, style: { fontSize: '24px', fontWeight: 700 } });
  S.text(1180, 640, '3 reports. 3 different totals.', 'hand', 4.3, { rot: -3, style: { fontSize: '44px' } });
  S.text(1110, 745, 'Then it meets real customer data.', 'hand', 4.9, { style: { fontSize: '52px' } });
  S.text(170, 850, 'That gap is <span class="mk"><i></i>the job.</span>', 'disp', 6.0, { anim: 'fade', style: { fontSize: '104px' } });
}

// ================================================================== SCENE 1 — who (8–16)
{
  const S = new Scene(8, 16, 'Who');
  S.text(160, 175, 'FORWARD DEPLOYED ENGINEER — DUBAI, UAE', 'mono', .25, { anim: 'fade', style: { fontSize: '24px', letterSpacing: '.22em', color: '#6f6c66' } });
  S.text(150, 225, 'Bhavya', 'disp', .35, { anim: 'pop', style: { fontSize: '250px', transformOrigin: 'left bottom' } });
  S.text(150, 460, '<span class="mk"><i></i>Dhoot</span>', 'disp', .5, { anim: 'pop', style: { fontSize: '250px', transformOrigin: 'left bottom' } });
  // laptop + wrench doodle
  S.path(rectP(1260, 280, 420, 270), .8, .5, { w: 6 });
  S.path(`M${P(1200, 600)} L${P(1740, 600)} L${P(1690, 555)} L${P(1245, 555)} Z`, 1.2, .4, { w: 6 });
  S.text(1395, 340, '&lt;/&gt;', 'mono', 1.5, { anim: 'pop', style: { fontSize: '96px', fontWeight: 700 } });
  S.path(scribLines(1310, 490, 320, 1), 1.7, .3, { w: 4, quiet: 1 });
  S.path(gearP(1660, 250, 44), 1.8, .5, { w: 5 });
  S.path(sparkP(1210, 250, 36), 2.1, .25, { w: 4, quiet: 1 });
  S.text(160, 760, 'I sit with your operators, find where time or money leaks, and ship the system that closes it.', 'body', 2.0, { anim: 'fade', w: 1560, style: { fontSize: '54px' } });
}

// ================================================================== SCENE 2 — how (16–29)
{
  const S = new Scene(16, 29, 'How I work');
  S.text(160, 130, 'How I work', 'hand', .2, { style: { fontSize: '84px' } });
  S.path(line(160, 240, 520, 236, 8), .75, .35, { w: 6 });
  const cols = [
    { x: 160, n: 1, at: .9, label: 'Sit with the operators', sub: 'learn the process as it really runs', icon: (S, x, at) => { S.path(personP(x + 110, 330, .8), at, .6, { w: 5 }); S.path(personP(x + 270, 330, .8), at + .2, .6, { w: 5, quiet: 1 }); S.path(line(x + 40, 440, x + 360, 440, 3), at + .5, .3, { w: 5, quiet: 1 }); S.path(rectP(x + 150, 400, 80, 40, 3), at + .6, .25, { w: 4, quiet: 1 }); } },
    { x: 740, n: 2, at: 2.4, label: 'Find the leak', sub: 'where time or money goes missing', icon: (S, x, at) => { S.path(`${line(x + 20, 360, x + 250, 360, 2)} ${line(x + 20, 410, x + 250, 410, 2)} ${line(x + 250, 360, x + 250, 410, 1)}`, at, .5, { w: 5 }); S.path(`M${P(x + 240, 420)} Q${P(x + 232, 445)} ${P(x + 242, 452)} Q${P(x + 252, 445)} ${P(x + 240, 420)}`, at + .4, .25, { w: 4, quiet: 1 }); S.path(`M${P(x + 240, 470)} Q${P(x + 232, 495)} ${P(x + 242, 502)} Q${P(x + 252, 495)} ${P(x + 240, 470)}`, at + .55, .25, { w: 4, quiet: 1 }); S.path(circleP(x + 300, 360, 60), at + .6, .45, { w: 6 }); S.path(line(x + 342, 402, x + 400, 460, 2), at + .95, .2, { w: 9, quiet: 1 }); } },
    { x: 1320, n: 3, at: 3.9, label: 'Ship the system', sub: 'and leave it running', icon: (S, x, at) => { S.path(gearP(x + 150, 380, 62), at, .7, { w: 5 }); S.path(arcP(x + 150, 380, 125, -2.6, 1.9), at + .5, .5, { w: 5, quiet: 1 }); S.path(arrowP(x + 150 + Math.cos(1.6) * 125, 380 + Math.sin(1.6) * 125, x + 150 + Math.cos(2.0) * 125, 380 + Math.sin(2.0) * 125, 0, 20), at + .95, .2, { w: 5, quiet: 1 }); S.path(checkP(x + 300, 300, 70), at + 1.0, .3, { w: 9 }); } },
  ];
  for (const c of cols) {
    badge(S, c.x + 34, 330, c.n, c.at);
    c.icon(S, c.x + 60, c.at + .2);
    S.text(c.x, 530, c.label, 'disp', c.at + .9, { anim: 'fade', style: { fontSize: '46px', whiteSpace: 'nowrap' }, w: 540 });
    S.text(c.x, 592, c.sub, 'hand', c.at + 1.2, { style: { fontSize: '38px', color: '#3a3833', whiteSpace: 'nowrap' }, w: 560 });
  }
  // the rule
  const y = 790, at = 6.3;
  S.path(rectP(160, y - 20, 470, 120), at, .45, { w: 5 });

  document.getElementById('stage').classList.toggle('dark', dark);
  document.getElementById('grid').style.opacity = dark ? 0 : 1;
  document.getElementById('grain').style.opacity = dark ? 0 : .35;
  document.getElementById('hud-b').textContent = cur.chapter;
  document.getElementById('hud-d').textContent = cur.idx;
  document.getElementById('hud-c').style.visibility = dark ? 'hidden' : 'visible';
  // wipe: draw in over [c-.4, c], erase over [c, c+.4]
  const w = document.getElementById('wipe-p');
  let off = 1, vis = false, color = '#c8ff00';
  for (const c of CUTS) {
    if (t >= c - .4 && t < c + .4) {
      vis = true; off = t < c ? 1 - eio(seg(t, c - .4, c)) : -eio(seg(t, c, c + .4));
      if (c === CUTS[CUTS.length - 1]) color = '#0a0a0a';
    }
  }
  w.style.stroke = color; w.style.strokeWidth = 330; w.style.strokeDasharray = '1 1'; w.style.strokeDashoffset = off; w.style.opacity = vis ? 1 : 0;
}
window.render = render;
window.DURATION = DURATION;
window.SFX = SFX.sort((a, b) => a.t - b.t);
window.ready = document.fonts.ready.then(() => Promise.all(['400 40px "Patrick Hand"', '800 100px Archivo', '500 40px Archivo', '700 40px Archivo', '400 20px "JetBrains Mono"', '700 20px "JetBrains Mono"'].map(f => document.fonts.load(f))));
</script>
