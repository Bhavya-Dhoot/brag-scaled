<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd768"/>
      <stop offset="30%" stop-color="#c9a227"/>
      <stop offset="70%" stop-color="#e8c75d"/>
      <stop offset="100%" stop-color="#8c6a0e"/>
    </linearGradient>
    <linearGradient id="cobaltGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f4e9c"/>
      <stop offset="100%" stop-color="#2aa3a8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a1918" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Sweeping Calligraphic Ottoman-inspired Latin Monogram ("NX" / NEXUS) -->
  <!-- Sweeping loop curves inspired by Ottoman imperial monogram architecture, composed entirely of Latin letterforms N and X -->
  <g filter="url(#shadow)" stroke="url(#goldGleam)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer sweeping sere / beyze loops -->
    <path d="M 40 130 C 25 80, 80 30, 160 30 C 240 30, 295 80, 280 130 C 270 160, 210 175, 160 170 C 110 175, 50 160, 40 130 Z" stroke-width="4.5" opacity="0.9"/>
    <path d="M 55 125 C 45 90, 90 48, 160 48 C 230 48, 275 90, 265 125 C 255 150, 205 160, 160 158 C 115 160, 65 150, 55 125 Z" stroke-width="2.5" opacity="0.7"/>
    
    <!-- Vertical tug/shaft plumes reaching upward (Latin N uprights extended) -->
    <path d="M 125 165 L 125 22" stroke-width="5"/>
    <path d="M 140 165 L 140 15" stroke-width="4"/>
    <path d="M 175 165 L 175 15" stroke-width="4"/>
    <path d="M 190 165 L 190 22" stroke-width="5"/>
    
    <!-- Plume finials / S-swashes -->
    <path d="M 125 22 C 120 12, 105 18, 108 28 C 112 36, 126 32, 128 42" stroke-width="2.5"/>
    <path d="M 140 15 C 135 6, 122 10, 124 20" stroke-width="2.2"/>
    <path d="M 175 15 C 180 6, 193 10, 191 20" stroke-width="2.2"/>
    <path d="M 190 22 C 195 12, 210 18, 207 28 C 203 36, 189 32, 187 42" stroke-width="2.5"/>
    
    <!-- Central Latin 'N' and 'X' interlock -->
    <!-- 'N' diagonal slash with flourish -->
    <path d="M 125 70 L 190 145" stroke-width="6"/>
    <!-- 'X' crossing strokes -->
    <path d="M 110 145 Q 160 100 205 60" stroke-width="4.5"/>
    <path d="M 115 65 Q 160 110 205 145" stroke-width="4.5"/>
    
    <!-- Sweeping horizontal tail flourish (kol) -->
    <path d="M 70 140 C 130 142, 220 142, 290 120 C 310 114, 305 95, 280 105 C 240 120, 160 135, 30 138" stroke-width="3"/>
  </g>
  
  <!-- Gilded leaf drop accents & floral Iznik dots -->
  <circle cx="160" cy="85" r="4.5" fill="url(#goldGleam)"/>
  <circle cx="95" cy="100" r="3.5" fill="#c73e1d"/>
  <circle cx="225" cy="100" r="3.5" fill="#2aa3a8"/>
  <circle cx="160" cy="120" r="3" fill="#1f4e9c"/>
</svg>
